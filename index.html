<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student grade tracker</title>
    <link rel="stylesheet" href="./fontawesome-free-7.1.0-web/css/all.css">
    <script src="https://kit.fontawesome.com/bd40e7d740.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=DM+Serif+Text:ital@0;1&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Young+Serif&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=DM+Serif+Text:ital@0;1&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Young+Serif&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./stylesheet.css">
    <script defer src="./script.js"></script>
</head>
<body>
    <div class="inputs">
         <h1>Student Grade Tracker</h1>

        <div class="subContainer">
            <label for="name" class="pageslide">Input the Student's Fullname:</label>
        <div class="inputbtngap pageslide">
            <input type="text" class="pageslide" name="Student name" placeholder="John Doe " id="name" autocomplete="off">
            <button class="add pageslide" id="addName" ><i class="fa-solid fa-plus"></i></button>
        </div>
        </div>
        
        <div class="subContainer">
          <label for="age" class="pageslide">Input the Student's Age:</label>
        <div class="inputbtngap pageslide">
            <input type="number" class="pageslide" name="age" id="age" placeholder="17">
            <button class="add pageslide" id="addAge"><i class="fa-solid fa-plus"></i></button>
        </div>  
        </div>
        
                <h2>Scores and Subjects</h2>
        <div class="scoreSubject">
            <div class="section pageslide subContainer">
                <label for="subjects">Enter Subjects</label>
                <div>
                    <input type="text" name="subject" id="subjects" autocomplete="off">
                    <button class="add" id="addSubject"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>  

            <div class="pageslide subContainer">
                <label for="scores" >Enter scores per Subject</label>
                <div>
                    <input type="number" name="scores" id="scores">
                    <button class="add "  id="addScores"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>
        </div>
        <button class="add lastbtn" id="average"><i class="fa-solid fa-calculator"></i>  Calculate Average</button>
    </div>
    <div class="slideininfo">
        <p>You have successfully added <span class="sname"></span> to the list </p> 
    </div>
    <div id="popupContainer">
        <div id="popup" >
            <button id="popupremove">x</button>
            <label for="popupcontent">Edit the following:</label>
            <div class="inputeditsubject">
                <input type="text" name="editsubject" class="popupcontent">
                <input type="text" name="editscore" id="popscoreinput">
                <button class="add" id="exitpopup">Enter</button>
            </div>
        </div>
    </div>

    <footer>
        <p><small>PΛRΛNORMΛLRΛVE || 2025</small></p>
    </footer>
</body>
</html>
